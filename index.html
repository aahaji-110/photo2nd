            opacity: 0.20;

        // Helper function to convert 24h time to 12h format (e.g., "15:10" -> "03:10 م")
        function convertTo12Hour(time24) {
            if (!time24 || !time24.includes(':')) return time24;
            const parts = time24.split(':');
            let hours = parseInt(parts[0], 10);
            const minutes = parts[1];
            const period = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedHours = hours < 10 ? '0' + hours : hours;
            return `${formattedHours}:${minutes} ${period}`;

        let matchesData = rawMatchesData.map(m => ({

            time: convertTo12Hour(m.time)

        // Generate remaining rounds up to 30
        const sampleTeams = ["الترجي", "الساحل", "الصفا", "عفيف", "النعيرية", "وج", "الباطن", "القوارة", "الغوطة", "الريان", "الهدى", "الجبيل", "النجوم", "الكوكب", "الشرق", "الوشم", "العربي", "قلوة", "اللواء", "القوس", "جبة", "الانتصار", "عرعر", "بيش", "جرش", "نجران", "القلعة", "مضر", "العين", "حطين"];

                let t2Idx = (r * 5 + m + 2) % sampleTeams.length;
                if (t1Idx === t2Idx) t2Idx = (t2Idx + 1) % sampleTeams.length;

                    id: matchesData.length + 1,
                    round: r,
                    dateStr: `${baseDay} ${baseDate}`,
                    time: "03:30 م",
                    team1: sampleTeams[t1Idx],

                    venue: `ملعب نادي ${sampleTeams[t1Idx]} (المدينة الرياضية)`

            const selectEl = document.getElementById('round-select');

            for (let i = 1; i <= 30; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `الجولة ${i}`;
                if (i === currentRound) opt.selected = true;
                selectEl.appendChild(opt);
            }
        }

            currentRound = parseInt(roundNum);
            renderMatches();
        }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between text-xs text-slate-400 mb-4 pb-3 border-b border-slate-800/80">
                            <span class="flex items-center gap-1.5 font-semibold text-emerald-400">

                            <div class="text-center w-5/12">
                                <span class="text-base md:text-lg font-black text-white tracking-wide block truncate" title="${match.team1}">${match.team1}</span>
                            </div>
                            <div class="w-2/12 flex justify-center">
                                <span class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-xs px-2.5 py-1 rounded-full shadow-md">VS</span>
                            </div>
                            <div class="text-center w-5/12">
                                <span class="text-base md:text-lg font-black text-white tracking-wide block truncate" title="${match.team2}">${match.team2}</span>
                            </div>
                        </div>

                        <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-3 mb-4 text-xs text-slate-300 flex items-start gap-2">
                            <i class="fa-solid fa-location-dot text-emerald-400 mt-0.5 shrink-0"></i>
                            <span class="leading-relaxed">${match.venue}</span>
                        </div>
                    </div>

                    <div class="mt-2">
                        <label class="block text-xs font-bold text-slate-400 mb-1.5 flex items-center gap-1.5">
                            <i class="fa-solid fa-camera text-teal-400"></i>
                            المصور المكلف بالمباراة:
                        </label>
                        <select onchange="updateAssignment(${match.id}, this.value)" class="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2.5 focus:outline-none focus:border-emerald-500 font-semibold cursor-pointer">
                            ${photographerOptions}
                        </select>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function updateAssignment(matchId, photographerVal) {
            if (photographerVal) {
                const parts = photographerVal.split(" - ");
                assignments[matchId] = {
                    name: parts[0],
                    region: parts[1],
                    phone: parts[2]
                };
                showToast(`تم تعيين المصور بنجاح`, "success");
            } else {
                delete assignments[matchId];
                showToast(`تم إزالة التعيين`, "info");
            }
        }

        function resetCurrentRoundAssignments() {
            matchesData.filter(m => m.round === currentRound).forEach(m => delete assignments[m.id]);
            renderMatches();
            showToast(`تم مسح تعيينات الجولة ${currentRound}`, "info");
        }

        function exportToWhatsApp() {
            const filteredMatches = matchesData.filter(m => m.round === currentRound);
            if (filteredMatches.length === 0) return;

            let report = `الجولة : ${currentRound}\n`;
            
            filteredMatches.forEach((match) => {
                report += `اليوم : ${match.dateStr.split(' ')[0]}\n`;
                report += `التاريخ : ${match.dateStr.split(' ')[1] || ''}    \\       \\\n`;
                report += `${match.team1} X ${match.team2}\n`;
                report += `الساعة : ${match.time}\n`;
                report += `المدينة : ${match.venue.includes('(') ? match.venue.split('(').pop().replace(')', '') : 'السعودية'}                 الملعب : ${match.venue}\n`;
                
                if (assignments[match.id]) {
                    const p = assignments[match.id];
                    report += `المصور : @${p.phone}\n`;
                } else {
                    report += `المصور : لم يتم التحديد\n`;
                }
                report += `--------------------------\n`;
            });

            const encodedText = encodeURIComponent(report);
            window.open(`https://wa.me/?text=${encodedText}`, '_blank');
            showToast("جاري التصدير إلى الواتساب...", "success");
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');

            msgEl.textContent = message;
            toast.className = `fixed bottom-6 left-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 ${type === 'success' ? 'bg-emerald-600' : 'bg-teal-600'} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-semibold`;
            
            setTimeout(() => {
                toast.className = "fixed bottom-6 left-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-semibold";
            }, 3000);
        }
    </script>
</body>
</html>
