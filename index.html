            const parts = time24.split(':');

        function initRoundsDropdown() {
            const selectEl = document.getElementById('round-select');

            for (let i = 1; i <= 30; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `الجولة ${i}`;
                if (i === currentRound) opt.selected = true;
                selectEl.appendChild(opt);
            }
        }

            currentRound = parseInt(roundNum);

            container.innerHTML = '';
            const filteredMatches = matchesData.filter(m => m.round === currentRound);

                const assigned = assignments[match.id] || "";

                let photographerOptions = `<option value="">-- اختر المصور المكلف --</option>`;
                photographers.forEach(p => {
                    const val = `${p.name} - ${p.region} - ${p.phone}`;
                    const isSelected = (assigned && assigned.name === p.name) ? "selected" : "";

        function updateAssignment(matchId, photographerVal) {
            if (photographerVal) {
                const parts = photographerVal.split(" - ");
                assignments[matchId] = {
                    name: parts[0],
                    region: parts[1],
                    phone: parts[2]
                };
                showToast(`تم تعيين المصور بنجاح`, "success");
            } else {
                delete assignments[matchId];
                showToast(`تم إزالة التعيين`, "info");
            }
        }

            matchesData.filter(m => m.round === currentRound).forEach(m => delete assignments[m.id]);

        function exportToWhatsApp() {
            const filteredMatches = matchesData.filter(m => m.round === currentRound);
            if (filteredMatches.length === 0) return;

            let report = `الجولة : ${currentRound}\n`;
            
            filteredMatches.forEach((match) => {
                report += `اليوم : ${match.dateStr.split(' ')[0]}\n`;
                report += `التاريخ : ${match.dateStr.split(' ')[1] || ''}    \\       \\\n`;
                report += `${match.team1} X ${match.team2}\n`;
                report += `الساعة : ${match.time}\n`;
                report += `المدينة : ${match.venue.includes('(') ? match.venue.split('(').pop().replace(')', '') : 'السعودية'}                 الملعب : ${match.venue}\n`;
                
                if (assignments[match.id]) {
                    const p = assignments[match.id];
                    report += `المصور : @${p.phone}\n`;
                } else {
                    report += `المصور : لم يتم التحديد\n`;
                }
                report += `--------------------------\n`;
            });

            const encodedText = encodeURIComponent(report);
            window.open(`https://wa.me/?text=${encodedText}`, '_blank');
            showToast("جاري التصدير إلى الواتساب...", "success");

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function buildReportHTML(round, list) {
            const rows = list.map((m, i) => {
                const p = assignments[m.id];
                const parts = m.dateStr.split(' ');
                const photographer = p
                    ? `<b>${escapeHtml(p.name)}</b><br><span style="color:#475569;font-size:10px;">${escapeHtml(p.region)} • ${escapeHtml(p.phone)}</span>`
                    : `<span style="color:#dc2626;font-weight:700;">لم يتم التحديد</span>`;
                const td = 'border:1px solid #cbd5e1;padding:5px 7px;text-align:center;vertical-align:middle;';
                return `<tr style="background:${i % 2 ? '#f1f5f9' : '#ffffff'};page-break-inside:avoid;">
                    <td style="${td}">${i + 1}</td>
                    <td style="${td}">${escapeHtml(parts[0])}<br><span style="color:#475569;font-size:10px;">${escapeHtml(parts[1] || '')}</span></td>
                    <td style="${td}white-space:nowrap;">${escapeHtml(m.time)}</td>
                    <td style="${td}font-weight:800;">${escapeHtml(m.team1)} × ${escapeHtml(m.team2)}</td>
                    <td style="${td}font-size:10px;">${escapeHtml(m.venue)}</td>
                    <td style="${td}">${photographer}</td>
                </tr>`;
            }).join('');

            const th = 'background:#0f172a;color:#ffffff;border:1px solid #0f172a;padding:6px 7px;text-align:center;font-weight:700;';
            return `<div dir="rtl" style="width:1050px;background:#ffffff;color:#0f172a;font-family:'Cairo',Arial,sans-serif;font-size:11px;padding:6px 10px;">
                <div style="text-align:center;margin-bottom:8px;">
                    <img src="${LOGO_ORIGINAL}" alt="" style="height:64px;width:auto;margin:0 auto;display:block;">
                    <div style="font-size:18px;font-weight:900;margin-top:4px;">تكاليف مصورين دوري الدرجة الثانية</div>
                    <div style="font-size:12px;color:#475569;font-weight:600;">الموسم الرياضي 2026-2027 • الجولة ${round} • عدد المباريات: ${list.length}</div>
                </div>
                <table style="width:100%;border-collapse:collapse;">
                    <thead><tr>
                        <th style="${th}width:4%;">م</th>
                        <th style="${th}width:14%;">اليوم والتاريخ</th>
                        <th style="${th}width:8%;">الوقت</th>
                        <th style="${th}width:22%;">المباراة</th>
                        <th style="${th}width:30%;">الملعب</th>
                        <th style="${th}width:22%;">المصور المكلف</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }

        function printReportFallback(html) {
            const w = window.open('', '_blank');
            if (!w) { showToast('المتصفح منع فتح نافذة الطباعة', 'info'); return; }
            w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تكليف الجولة ${currentRound}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>@page{size:A4 landscape;margin:8mm}body{margin:0}</style></head><body>${html}</body></html>`);
            w.document.close();
            setTimeout(() => w.print(), 800);
        }

        async function exportToPDF() {
            const list = matchesData.filter(m => m.round === currentRound);
            if (list.length === 0) return;

            const unassigned = list.filter(m => !assignments[m.id]).length;
            if (unassigned > 0 && !confirm(`باقي ${unassigned} مباراة بدون مصور مكلف. تبغى تصدّر ملف PDF كذا؟`)) return;

            const html = buildReportHTML(currentRound, list);
            if (typeof html2pdf === 'undefined') { printReportFallback(html); return; }

            showToast('جاري تجهيز ملف PDF...', 'info');
            const holder = document.createElement('div');
            holder.innerHTML = html;
            try {
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await html2pdf().set({
                    margin: [8, 8, 8, 8],
                    filename: `تكليف_الجولة_${currentRound}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                    pagebreak: { mode: ['css', 'legacy'], avoid: ['tr'] }
                }).from(holder.firstElementChild).save();
                showToast('تم تصدير ملف PDF', 'success');
            } catch (e) {
                console.error(e);
                printReportFallback(html);
            }
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');

            msgEl.textContent = message;
            toast.className = `fixed bottom-6 left-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 ${type === 'success' ? 'bg-emerald-600' : 'bg-teal-600'} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-semibold`;
            
            setTimeout(() => {
                toast.className = "fixed bottom-6 left-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-semibold";
            }, 3000);
        }
    </script>
</body>
